<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estructura con Columnas - Servicios</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #c4ffba;
            padding: 10px 20px;
        }

        .logo-pequeno {
            width: 300px;
            height: auto;
            display: block;
        }

        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .boton-nav {
            text-decoration: none;
            color: #b4ff9c;
            background-color: #47a242;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }

        .boton-nav.activo {
            background-color: #6fa368;
            color: #ffffff;
            font-weight: bold;
        }

        .boton-nav:hover {
            background-color: rgb(189, 253, 166);
            color: white;
        }

        main {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        aside {
            width: 25%;
            background-color: hsl(128, 100%, 77%);
            padding: 15px;
        }

        .imagen-publicidad {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Clase independiente para la imagen del artículo */
        .imagen-articulo {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgb(110, 255, 65);
        }

        section {
            width: 75%;
            background-color: #6dff6d;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">Mi mundo</h1>
            <nav class="barra-navegacion">
                <a href="index.html" class="boton-nav">Inicio</a>
                <a href="archivo1.html" class="boton-nav activo">sobre mi</a>
                <a href="archivo2.html" class="boton-nav">mi mundo</a>
            </nav>
        </div>
        <img src="massmio.jpg" alt="Logo de Mi Sitio Web" title="Logo de la marca" class="logo-pequeno">
    </header>

    <main>
        <aside>
            <h3>Publicidad</h3>
            <p>¡Prueba crumbolll cookies tu mejor aliado!</p>
            <img src="publicidad.jpg" alt="Publicidad de Cookies" class="imagen-publicidad">
        </aside>
        <section>
            <article>
                <h2>recuerdos y momentos </h2>
                <img src="nm.jpg" alt="Los ksimeritos" class="imagen-articulo">
                <img src="happy yuyo me 4 .JPG" alt="Los ksimeritos" class="imagen-articulo">

                <p>Ellos son mis recuerdos y momentos que me han hecho feliz</p>
                <p> en esos recuerdos estan mis amigos ,hermano y yop </p>
            </article>
        </section>
    </main>

    <footer>
        <p>redes sociales ____bykenia</p>
    </footer>
</body>

</html>
