<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estructura con Columnas</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffb9f3;
            padding: 10px 20px;
        }

        .logo-pequeno {
            width: 200px;
            height: auto;
            display: block;
        }

        .barra-navegacion {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .boton-nav {
            text-decoration: none;
            color: #ffbcbc;
            background-color: #FFD1DC;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s ease;
        }

        .boton-nav.activo {
            background-color: #FFD1DC;
            color: #ffffff;
            font-weight: bold;
        }

        .boton-nav:hover {
            background-color: rgb(248, 159, 240);
            color: rgb(255, 255, 255);
        }

        main {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        aside {
            width: 25%;
            background-color: #FFD1DC;
            padding: 15px;
        }

        .imagen-publicidad {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Nueva clase para la imagen del artículo */
        .imagen-articulo {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px #FFD1DC;
        }

        section {
            width: 75%;
            background-color: #ffc5f7;
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">mi blogsito de vida</h1>
            <nav class="barra-navegacion">
                <a href="mexta.html" class="boton-nav activo">Inicio</a>
                <a href="archivo1.html" class="boton-nav">sobre mi </a>
                <a href="archivo2.html" class="boton-nav">mi mundo</a>
            </nav>
        </div>
        <img src="mexta.jpg" alt="Logo de Mi Sitio Web" title="Logo de la marca" class="logo-pequeno">
    </header>

    <main>
        <aside>
            <h3>Publicidad</h3>
            <p>¡Prueba las mejores cookies!</p>
            <img src="publicidad.jpg" alt="Publicidad de Cookies" class="imagen-publicidad">
        </aside>
        <section>
            <article>
                <h2>Bienvenidos </h2>
                <img src="mio.jpg" alt="Los ksimeritos" class="imagen-articulo">
            </article>
        </section>
    </main>

    <footer>
        <p>REDES SOCIALES ____bykenia</p>
    </footer>
</body>

</html>
